const CLS_CELL=/^(?:grade|class|std|form)?\s*([789])\s*[-\s]?\s*(athi|tana)$/i,CLS_ANY=/\b([789])\s*[-\s]?\s*(athi|tana)\b/i;
function plParse(txt){let cur="";const it=[],bad=[];
  String(txt||"").replace(/^\uFEFF/,"").split(/\r?\n/).forEach(raw=>{const l=raw.trim();if(!l)return;
    const hm=l.replace(/[:\-–]+$/,"").trim().match(CLS_CELL);if(hm){cur=hm[1]+" "+capw(hm[2]);return}
    let cols=l.split(/\t|,/).map(v=>v.trim()).filter(Boolean),cls=cur,adm="",phone="";
    const ci=cols.findIndex(v=>CLS_CELL.test(v));
    if(ci>-1){const m=cols[ci].match(CLS_CELL);cls=m[1]+" "+capw(m[2]);cols.splice(ci,1)}
    else if(cols.length===1){const m=l.match(CLS_ANY);if(m){cls=m[1]+" "+capw(m[2]);cols=[l.replace(CLS_ANY,"").replace(/[\s\-–:]+$/,"").trim()]}}
    if(cols.length&&/^\d+[.)]?$/.test(cols[0])&&cols.length>1)cols.shift();
    const ai=cols.findIndex(v=>/^OS[A-Z0-9\/-]+$/i.test(v));if(ai>-1){adm=admN(cols[ai]);cols.splice(ai,1)}
    const pi=cols.findIndex(v=>/^\+?\d[\d\s]{8,}$/.test(v));if(pi>-1){let p=cols[pi].replace(/\s/g,"");if(p.startsWith("+254"))p="0"+p.slice(4);else if(p.startsWith("254"))p="0"+p.slice(3);if(/^0[17]\d{8}$/.test(p))phone=p;cols.splice(pi,1)}
    const name=(cols[0]||"").replace(/^\d+[.)]\s*/,"").replace(/\s+/g," ").trim();
    if(!/[A-Za-z]/.test(name))return;
    if(!cls){bad.push(l);return}
    it.push({name,cls,adm,phone,parent:(cols[1]||"").trim()})});
  return{it,bad}}
function planOf(txt){const P=plParse(txt),seen=new Set(),used=new Set(),rows=[];
  P.it.forEach(r=>{const k=r.cls+"|"+r.name.toLowerCase();if(seen.has(k)){rows.push(Object.assign({act:"skip",note:"Listed twice"},r));return}seen.add(k);
    const ex=live().find(s=>s.name.trim().toLowerCase()===r.name.toLowerCase());
    if(ex){if(ex.cls===r.cls)rows.push(Object.assign({act:"skip",note:"Already in "+r.cls},r));else rows.push(Object.assign({act:"move",id:ex.id,from:ex.cls},r));return}
    let adm=r.adm;if(adm&&(admBad(adm)||used.has(adm)))adm="";if(adm)used.add(adm);rows.push(Object.assign({},r,{act:"new",adm}))});
  return{rows,bad:P.bad}}

function saveProf(id){if(!adm())return T("Only the admin can do this");const u=U(id),p=ui.tp;if(!u||!p)return;const n=p.name.trim(),ph=p.phone.replace(/\s/g,"");if(!n)return T("Enter the teacher’s name");if(ph&&!/^0[17]\d{8}$/.test(ph))return T("Enter a valid phone, e.g. 0712345678");if(S.users.some(x=>x.role==="teacher"&&x.id!==id&&x.name.toLowerCase()===n.toLowerCase()))return T("Another teacher already has that name");

    const bs=new Set(ba.map(ser)),ls=new Set(l.map(ser)),rs=new Set(r.map(ser));
    return l.filter(x=>!bs.has(ser(x))&&!rs.has(ser(x))).concat(r.filter(x=>!(bs.has(ser(x))&&!ls.has(ser(x)))))}
  mc3.n++;return l}
async function fb(path,o){o=o||{};const c=syCfg();if(!c)throw new Error("Not connected");
  const url=c.url.replace(/\/+$/,"")+"/schools/"+encodeURIComponent(c.id)+"/"+path+".json";
  const run=async(h)=>fetch(url,{method:o.method||"GET",headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined,cache:"no-store"});
  const hd={};if(o.etag&&!fb.noEtag)hd["X-Firebase-ETag"]="true";if(o.ifMatch&&!fb.noEtag)hd["if-match"]=o.ifMatch;
  let r;try{r=await run(hd)}catch(e){if(Object.keys(hd).length&&navigator.onLine){fb.noEtag=1;r=await run({})}else throw e}
  if(r.status===412)return{conflict:true};
  if(r.status===401||r.status===403)throw new Error("Database rules block access");
  if(!r.ok)throw new Error("Server error "+r.status);
  return{data:await r.json(),etag:r.headers.get("ETag")}}
function syBase(){try{return JSON.parse(localStorage.getItem("os_base")||"null")}catch(e){return null}}
function syLocal(){const o={};Object.keys(S).forEach(k=>{if(S[k]!==undefined)o[k]=ser(S[k])});return o}
function syReplaceS(obj){Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,obj)}
function syPersist(base,stamp){try{localStorage.setItem("osembo1",JSON.stringify(S));localStorage.setItem("os_base",JSON.stringify(base));if(stamp!==undefined)localStorage.setItem("os_stamp",stamp)}catch(e){}}
function syKm(){S.km={locked:localStorage.getItem("km_app_locked")==="1",revoked:localStorage.getItem("km_admin_revoked")==="1"}}
function syApplyKm(){if(!S.km)return false;const was=localStorage.getItem("km_app_locked")==="1";localStorage.setItem("km_app_locked",S.km.locked?"1":"0");localStorage.setItem("km_admin_revoked",S.km.revoked?"1":"0");return was!==!!S.km.locked}
let syBusy=0,syAgain=0,syTimer=0,syLast=null,syState="off",syMsg="";
function syPill(st,msg){syState=st;syMsg=msg||"";let p=document.getElementById("syncpill");
  if(!p){p=document.createElement("div");p.id="syncpill";p.onclick=()=>syncNow({});p.style.cssText="position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:50;font:600 11px system-ui;padding:5px 10px;border-radius:99px;background:var(--card);color:var(--tx);border:1px solid var(--line);opacity:.92;cursor:pointer";document.body.appendChild(p)}
  const t=syLast?syLast.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
  p.textContent=st==="ok"?"● Synced "+t:st==="busy"?"↻ Syncing…":st==="off"?"○ Offline · saved on phone":st==="wait"?"◔ Waiting for owner setup":st==="err"?"⚠ "+msg:"";
  p.style.display=st==="none"?"none":"block"}
function syRender(force){const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName),modal=$("#modal")&&$("#modal").innerHTML.trim()!=="";
  if(!force&&(typing||modal)){syRender.p=1;return}
  syRender.p=0;if(ui.sess&&!ui.kmOwner){const u=U(ui.sess);if(!u||u.suspended)ui.sess=null}R()}
async function syncKey(k,loc,base){
  for(let n=0;n<5;n++){
    const r=await fb("data/"+k,{etag:1}),remote=r.data==null?undefined:JSON.parse(r.data);
    const m=merge3(base,loc,remote),ms=ser(m);
    if(ms===ser(remote))return{m,pushed:false};
    const w=await fb("data/"+k,{method:m===undefined?"DELETE":"PUT",body:ms,ifMatch:r.etag&&!fb.noEtag?r.etag:undefined});
    if(w.conflict)continue;
    if(!r.etag||fb.noEtag){const v=await fb("data/"+k);if(v.data!==ms)continue}
    return{m,pushed:true}}
  throw new Error("Busy, retrying")}
async function syncNow(o){o=o||{};
  if(!syCfg()){syPill("none");return}
  if(syBusy){syAgain=1;return}
  if(!navigator.onLine){syPill("off");return}
  syBusy=1;syPill("busy");
  try{
    const meta=(await fb("meta")).data,hasBase=!!localStorage.getItem("os_base");
    if(o.master){
      syKm();const L=syLocal();await fb("data",{method:"PUT",body:L});
      await fb("meta",{method:"PUT",body:{stamp:Date.now()+"-"+Math.random().toString(36).slice(2),init:true}});
      syPersist(L,"");T("This phone's data is now the shared master copy ✓")}
    else if(meta===null){syPill("wait");return}
    else if(!hasBase){
      const rem=(await fb("data")).data||{},ns={},base={};
      Object.keys(rem).forEach(k=>{const v=JSON.parse(rem[k]);ns[k]=v;base[k]=ser(v)});
      try{localStorage.setItem("osembo1_prejoin",localStorage.getItem("osembo1")||"")}catch(e){}
      syReplaceS(ns);const lk=syApplyKm();fix();syPersist(base,meta.stamp||"");syRender(true);T("Connected: school data loaded ✓")}
    else{
      syKm();
      const base=syBase()||{},loc=syLocal(),dirty=Object.keys(loc).some(k=>loc[k]!==base[k])||Object.keys(base).some(k=>loc[k]===undefined);
      if(!dirty&&meta.stamp===localStorage.getItem("os_stamp")){syLast=new Date();syPill("ok");if(syRender.p)syRender();return}
      const rem=(await fb("data")).data||{},keys=new Set([...Object.keys(loc),...Object.keys(rem)]),snap={};
      Object.keys(S).forEach(k=>snap[k]=S[k]===undefined?undefined:JSON.parse(ser(S[k])));
      let pushed=0,changed=0,kmFlip=false;const nb=Object.assign({},base),upd={};
      for(const k of keys){
        const l=loc[k],b=base[k],rs=rem[k]===undefined?undefined:ser(JSON.parse(rem[k]));
        if(l===b&&rs===b)continue;
        let res;
        if(l===b){res={m:rs===undefined?undefined:JSON.parse(rs),pushed:false}}
        else res=await syncKey(k,snap[k],b===undefined?undefined:JSON.parse(b));
        if(res.pushed)pushed=1;
        upd[k]=res.m}
      for(const k in upd){
        if(S[k]!==undefined?ser(S[k])!==loc[k]:loc[k]!==undefined)continue;
        const ms=ser(upd[k]);
        if(ms!==loc[k]){changed=1;if(upd[k]===undefined)delete S[k];else S[k]=upd[k]}
        if(ms===undefined)delete nb[k];else nb[k]=ms}
      if(changed){kmFlip=syApplyKm();fix()}
      if(pushed)await fb("meta/stamp",{method:"PUT",body:Date.now()+"-"+Math.random().toString(36).slice(2)});
      syPersist(nb,pushed?"":meta.stamp||"");
      if(changed)syRender(kmFlip)}
    syLast=new Date();syPill("ok")}
  catch(e){syPill(navigator.onLine?"err":"off",e.message)}
  finally{syBusy=0;if(syAgain){syAgain=0;setTimeout(()=>syncNow({}),600)}}}
function syncSoon(){if(!syCfg())return;clearTimeout(syTimer);syTimer=setTimeout(()=>syncNow({}),2000)}
setInterval(()=>{if(document.visibilityState==="visible")syncNow({})},20000);
window.addEventListener("online",()=>syncNow({}));window.addEventListener("offline",()=>syPill("off"));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow({})});
setTimeout(()=>{syCfg()?syncNow({}):0},800);

/* owner setup card */
function syncCard(){const c=syCfg()||{url:"",id:""},st={ok:"Connected and up to date",busy:"Syncing…",off:"Offline",wait:"Connected, waiting for master data",err:"Problem: "+syMsg,none:"Not connected"}[syState]||"";
  return `<div class="card" style="border-left:6px solid var(--pri)"><h3>Central database (all phones)</h3><div class="m">Status: <b>${esc(st)}</b>${syLast?" · last sync "+syLast.toLocaleTimeString():""}</div>

function syncSave(){const u=($("#syUrl").value||"").trim(),i=($("#syId").value||"").trim();if(!/^https:\/\/.+/.test(u)||i.length<12)return T("Enter the https database URL and an ID of 12+ characters");localStorage.setItem("os_sync",JSON.stringify({url:u,id:i}));kmAudit("Central database connected");T("Saved");syncNow({})}

function syncMaster(){if(!ui.kmOwner)return;if(!syCfg())return T("Save the connection first");if(!confirm("Make THIS phone's data the shared master copy? Any existing shared data will be replaced for everyone."))return;kmAudit("Uploaded master data");syncNow({master:true})}
function syncOff(){if(!confirm("Disconnect this phone? Its data stays on the phone but stops syncing."))return;localStorage.removeItem("os_sync");localStorage.removeItem("os_base");localStorage.removeItem("os_stamp");syPill("none");if(ui.kmOwner)R();T("Disconnected")}

/* ================= FILE SYNC (no server) =================
   Teachers: "Send my updates" -> file (WhatsApp). Admin: imports updates, merges, then "Send master" -> teachers import it.
   Uses the same 3-way merge as the database sync, so different teachers' marks never overwrite each other. */
const mc3={n:0},FS_BLOCK=["act","subVerified","pend","km","preview","adminPw1","lastBak","schoolPhone"];
const fsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},fsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const FS_LBL={st:"Students, fees & remedial",res:"Marks",rem:"Report comments",attendance:"Attendance",users:"Teachers",announcements:"Announcements",hand:"Handovers",notes:"Notes",proc:"Processed results",receipts:"Receipts",log:"Activity log",fp:"Fee payments",subjT:"Subject teachers",pub:"Published exams"};
function dcount(a,b){if(ser(a)===ser(b))return 0;
  if(Array.isArray(a)&&Array.isArray(b)){if(syKeyed(a)&&syKeyed(b)){const am=new Map(a.map(x=>[String(x.id),x])),bi=new Set(b.map(x=>String(x.id)));let n=0;b.forEach(x=>{n+=am.has(String(x.id))?dcount(am.get(String(x.id)),x):1});a.forEach(x=>{if(!bi.has(String(x.id)))n++});return n}return Math.abs(b.length-a.length)||1}
  if(syIsObj(a)&&syIsObj(b)){let n=0;new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>n+=dcount(a[k],b[k]));return n}return 1}
function fsPack(kind){const u=me(),L=syLocal(),B=fsGet("os_fbase")||{},d={},b={};
  Object.keys(L).forEach(k=>{if(kind==="master"||L[k]!==B[k]){d[k]=L[k];if(B[k]!==undefined)b[k]=B[k]}});
  return Object.keys(d).length?JSON.stringify({osync:1,kind,from:u.id,name:u.name,at:Date.now(),stamp:Date.now()+"-"+Math.random().toString(36).slice(2),data:d,base:b}):""}
async function fsSend(kind){const u=me();if(!u)return;if(kind==="master"&&!adm())return T("Only the admin can do this");
  const txt=fsPack(kind);if(!txt)return T("Nothing new to send since the last master file");
  const day=new Date().toISOString().slice(0,10),nm=kind==="master"?"Osembo-MASTER-"+day+".json":"Osembo-UPDATE-"+String(u.name).replace(/\W+/g,"")+"-"+day+".json";
  fsSet(kind==="master"?"os_fmaster":"os_fsent",Date.now());LOG(kind==="master"?"Sent master file":"Sent update file");save();
  try{const f=new File([txt],nm,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nm,text:"Osembo sync file"});R();return}}catch(e){if(e&&e.name==="AbortError")return}
  dl(nm,txt,"application/json");R()}
function fsMergeUpd(j){const snd=S.users.find(x=>x.id===j.from);if(!snd)return{name:j.name||"?",err:"Sender is not a user on this device"};
  const priv=snd.role==="admin"||snd.full,rep={name:snd.name,ch:0,cf:0,skip:[],keys:[]};mc3.n=0;
  Object.keys(j.data).forEach(k=>{if(!priv&&FS_BLOCK.includes(k)){rep.skip.push(k);return}
    const l=S[k],b=j.base&&j.base[k]!==undefined?JSON.parse(j.base[k]):undefined,m=merge3(b,l,JSON.parse(j.data[k])),n=dcount(l,m);
    if(n){S[k]=m;rep.ch+=n;rep.keys.push(FS_LBL[k]||k)}});
  rep.cf=mc3.n;LOG("Imported update from "+snd.name+": "+rep.ch+" changes");return rep}
async function fsImportUpd(inp){if(!adm())return T("Only the admin can do this");const fl=[...inp.files];inp.value="";const rep=[];
  for(const f of fl){try{const j=JSON.parse(await f.text());if(j.osync!==1||j.kind!=="upd"&&j.kind!=="update")throw 0;rep.push(fsMergeUpd(j))}catch(e){rep.push({name:f.name,err:"Not an Osembo update file"})}}
  fix();save();fsReport(rep)}
function fsReport(rep){const tot=rep.reduce((a,r)=>a+(r.ch||0),0);
  M(`<div class="ov" onclick="if(event.target===this)cm()"><div class="sheet" style="max-height:90vh;overflow:auto"><h3>Import summary</h3><p class="m">${tot} change${tot===1?"":"s"} merged in total.</p>`+rep.map(r=>r.err?`<div class="card" style="border-left:4px solid var(--no)"><b>${esc(r.name)}</b><div class="m">${esc(r.err)}</div></div>`:`<div class="card"><b>${esc(r.name)}</b><div class="m">${r.ch} change${r.ch===1?"":"s"}${r.keys.length?" · "+esc(r.keys.join(", ")):""}</div>${r.cf?`<div class="m" style="color:var(--no)">${r.cf} conflict${r.cf===1?"":"s"}: same item edited on both sides, the admin's version was kept</div>`:""}${r.skip.length?`<div class="m">Ignored admin-only settings from a non-admin file</div>`:""}</div>`).join("")+`<button class="btn" onclick="cm();R()">Done</button></div></div>`)}
function fsImportMaster(inp){const f=inp.files[0];inp.value="";if(!f)return;
  f.text().then(t=>{let j;try{j=JSON.parse(t);if(j.osync!==1||j.kind!=="master")throw 0}catch(e){return T("That is not an Osembo master file")}
    const first=!fsGet("os_fbase");
    if(first&&!confirm("First time joining: this replaces the school data on this phone with the admin's master copy. Your old data is kept as a backup on the phone. You may need to log in again. Continue?"))return;
    fsApplyMaster(j,first)})}
function fsApplyMaster(j,first){const D={};Object.keys(j.data).forEach(k=>D[k]=JSON.parse(j.data[k]));let ch=0,cf=0;mc3.n=0;
  if(first){try{localStorage.setItem("osembo1_prejoin",localStorage.getItem("osembo1")||"")}catch(e){}syReplaceS(D);ch=Object.keys(D).length;ui.tab="home"}
  else{const B=fsGet("os_fbase")||{};Object.keys(D).forEach(k=>{const b=B[k]!==undefined?JSON.parse(B[k]):undefined,l=S[k],m=merge3(b,D[k],l),n=dcount(l,m);if(n){S[k]=m;ch+=n}});cf=mc3.n}
  fsSet("os_fbase",j.data);fsSet("os_frecv",Date.now());fix();save();syRender(true);
  T(first?"Joined: school data loaded ✓":ch?"Updated from master: "+ch+" change"+(ch===1?"":"s")+(cf?", "+cf+" of yours replaced by the admin's":""):"Already up to date ✓")}
function vSyncF(){const u=me(),ad=adm(u),ts=k=>{const v=fsGet(k);return v?new Date(v).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"never"};
  return `<h2 class="sec">Sync devices</h2><p class="m">No internet or server needed. Teachers send updates to the admin, the admin merges them and sends one master file back to everyone.</p>

  +(ad?`<div class="card" style="border-left:6px solid var(--pri)"><h3>Admin: import teacher updates</h3><span class="fbtn btn" style="margin-top:8px">Choose update files<input type="file" multiple accept=".json,application/json" onchange="fsImportUpd(this)"></span><p class="m">You can pick several teachers' files at once. Each teacher's marks and records are merged in, and you get a summary.</p><h3 style="margin-top:14px">Admin: send master to teachers</h3><div class="m">Last sent: ${ts("os_fmaster")}</div><button class="btn g" style="margin-top:8px" onclick="fsSend('master')">Send master file</button><p class="m">Do this after importing updates. Send it privately or in a teachers-only group, as it holds all school data and login codes.</p></div>`:"")
  +`<div class="card"><h3>Tips</h3><p class="m">Sync at least once a week, for example on Friday. Teachers should send updates before importing a new master. Download a backup from time to time as well.</p></div>`}

load();try{const x=sessionStorage.getItem("os_sess"),u=x&&U(x);if(u&&u.pass&&!u.suspended){ui.sess=x;ui.week=S.week;if(u.role==="teacher"&&!adm(u))ui.cls=u.cls}}catch(e){}R();setInterval(purgePub,36e5);
