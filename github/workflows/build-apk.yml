name: Build and publish Android APK

on:
  push:
    branches: [main, master]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Make sure the app file is in place and the native bridge is loaded
        run: |
          test -f www/index.html || { echo "www/index.html is missing. Put your Osembo HTML file there."; exit 1; }
          if ! grep -q "native-bridge.js" www/index.html; then
            perl -0pi -e 's#(.*)</body>#$1<script src="native-bridge.js"></script></body>#s' www/index.html
          fi
          grep -c "native-bridge.js" www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon (optional, uses resources/icon.png)
        if: hashFiles('resources/icon.png') != ''
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor "#0B4F4A" --iconBackgroundColorDark "#0B4F4A"

      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          (cd android && ./gradlew assembleRelease --no-daemon)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "Osembo-v$VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Build debug APK (no keystore set up)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::No signing keystore found. Building a debug APK. Each build is signed differently, so phones must uninstall before updating. See README."
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk "Osembo-v$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Osembo-apk
          path: Osembo-v${{ env.VERSION_NAME }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Osembo ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: Osembo-v${{ env.VERSION_NAME }}.apk
